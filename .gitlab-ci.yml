# GitLab CI — boogiepop-calculator (remote MF Calculadora)
#
# La calculadora se publica como estático en el bucket hub-manifest (manifest S3),
# NO en ECS — el react-seed ocupa boogiepop-api-fe-remote-svc en /mf.
#
# develop (push): lint + vite-build (sin deploy).
# main (push): lint + vite-build (base S3) + s3 sync → remotes/calculator/
#
# Variables (Settings → CI/CD → Variables):
# - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (Protected en main; permiso s3:PutObject en hub-manifest)

stages:
  - verify
  - build
  - deploy

default:
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

variables:
  AWS_DEFAULT_REGION: us-east-1
  HUB_MANIFEST_BUCKET: "boogiepop-hub-manifest-653876198281"
  CALCULATOR_S3_PREFIX: "remotes/calculator"
  # Base pública del build prod (debe coincidir con remoteEntry del manifest S3).
  VITE_REMOTE_BASE_PROD: "https://boogiepop-hub-manifest-653876198281.s3.us-east-1.amazonaws.com/remotes/calculator/"

lint:
  stage: verify
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - npm ci
    - npm run lint

vite-build:
  stage: build
  image: node:22-bookworm-slim
  needs: ["lint"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - npm ci
    - |
      if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        export VITE_REMOTE_BASE="${VITE_REMOTE_BASE_PROD}"
        echo "Build prod calculadora: VITE_REMOTE_BASE=${VITE_REMOTE_BASE}"
      else
        export VITE_REMOTE_BASE="${VITE_REMOTE_BASE:-/}"
        echo "Build dev/MR calculadora: VITE_REMOTE_BASE=${VITE_REMOTE_BASE}"
      fi
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

.deploy_calculator_s3:
  stage: deploy
  image:
    name: amazon/aws-cli:2.27.25
    entrypoint: [""]
  needs: ["vite-build"]
  before_script:
    - |
      set -eu
      if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "ERROR: faltan AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY en CI/CD Variables (Protected en main)."
        exit 1
      fi
      if [ -z "${HUB_MANIFEST_BUCKET:-}" ]; then
        echo "ERROR: HUB_MANIFEST_BUCKET vacío."
        exit 1
      fi
  script:
    - aws sts get-caller-identity
    - |
      set -eux
      DEST="s3://${HUB_MANIFEST_BUCKET}/${CALCULATOR_S3_PREFIX}/"
      echo "Sync calculadora → ${DEST}"
      aws s3 sync dist/ "${DEST}" --delete --region "${AWS_DEFAULT_REGION}"
      aws s3 cp dist/remoteEntry.js "${DEST}remoteEntry.js" \
        --cache-control "max-age=60, must-revalidate" \
        --content-type "application/javascript" \
        --region "${AWS_DEFAULT_REGION}"

deploy-calculator-s3-prod:
  extends: .deploy_calculator_s3
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never
