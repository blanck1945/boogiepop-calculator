# GitLab CI — boogiepop-calculator (remote MF Calculadora)
# Mismo patrón que boogiepop-react-seed — ver docs/GITLAB-DEPLOY.md
#
# develop: lint + vite-build; Docker/ECS MANUAL
# main: lint + vite-build + Docker/ECS AUTOMÁTICO → prod (:latest + ECS)
#
# Variables GitLab: ECR_REGISTRY, AWS_* , VITE_REMOTE_BASE (build Docker)

stages:
  - verify
  - build
  - deploy

default:
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

variables:
  AWS_DEFAULT_REGION: us-east-1
  ECR_REPOSITORY: boogiepop-calculator
  ECS_CLUSTER_NAME: boogiepop-api-cluster
  ECS_CALC_SERVICE_NAME: boogiepop-api-fe-calc-svc
  ECR_REGISTRY: "653876198281.dkr.ecr.us-east-1.amazonaws.com"
  # Base pública donde se sirven los chunks (ALB path /calc/).
  VITE_REMOTE_BASE: "http://boogiepop-api-alb-1499079717.us-east-1.elb.amazonaws.com/calc/"

lint:
  stage: verify
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - npm ci
    - npm run lint

vite-build:
  stage: build
  image: node:22-bookworm-slim
  needs: ["lint"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

.docker_publish_calc:
  stage: deploy
  image: ubuntu:22.04
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  needs: ["vite-build"]
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    FF_NETWORK_PER_BUILD: "1"
  before_script:
    - |
      set -eu
      if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "ERROR: faltan AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY en CI/CD Variables."
        exit 1
      fi
      if [ -z "${VITE_REMOTE_BASE:-}" ]; then
        echo "ERROR: VITE_REMOTE_BASE vacío — calculadora no sabe su URL pública."
        exit 1
      fi
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates unzip gnupg
    - install -dm755 /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-ce-cli docker-buildx-plugin
    - curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp
    - /tmp/aws/install -i /usr/local/aws-cli -b /usr/local/bin
    - aws sts get-caller-identity
    - sleep 3
    - docker info
    - docker buildx create --name ci-calc-build --use 2>/dev/null || docker buildx use ci-calc-build
    - docker run --privileged --rm tonistiigi/binfmt:latest --install all
    - bash -cx 'REG_HOST=$(echo "${ECR_REGISTRY}" | cut -d/ -f1); aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REG_HOST}"'
  script:
    - |
      set -eux
      BASE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
      IMAGE_URI="${BASE_URI}:${IMAGE_TAG}"
      BUILD_ARGS="--build-arg VITE_REMOTE_BASE=${VITE_REMOTE_BASE}"
      COMMON="docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push ${BUILD_ARGS}"
      if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        ${COMMON} -t "${IMAGE_URI}" -t "${BASE_URI}:latest" .
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        ${COMMON} -t "${IMAGE_URI}" -t "${BASE_URI}:latest" .
      else
        ${COMMON} -t "${IMAGE_URI}" -t "${BASE_URI}:develop" .
      fi

docker-publish-calc:
  extends: .docker_publish_calc
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
    - when: never

docker-publish-calc-prod:
  extends: .docker_publish_calc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never

deploy-calc-ecs-prod:
  stage: deploy
  image:
    name: amazon/aws-cli:2.27.25
    entrypoint: [""]
  needs: ["docker-publish-calc-prod"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never
  script:
    - aws sts get-caller-identity
    - aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ECS_CALC_SERVICE_NAME" --force-new-deployment --region "$AWS_DEFAULT_REGION"
